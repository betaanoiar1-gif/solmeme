[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meme-alpha-hunter"
version = "1.0.0"
description = "Solana Memecoin Intelligence, Sniper, Whale Tracking & Paper Trading Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Meme Alpha Hunter Research Team"}
]
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
meme-hunter = "app.cli.cli_app:main"
