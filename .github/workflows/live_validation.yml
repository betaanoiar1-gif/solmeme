name: Solana Live Validation

on:
  push:
    branches:
      - arena/01a07111-solmeme
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solana-live-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-live:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install tabulate python-dotenv requests pandas

      - name: Probe Network and Solana RPC
        run: |
          python3 scripts/probe_network.py

      - name: Run Solana Live Paper Trading Engine (5 Hours)
        env:
          DATA_MODE: live
          REAL_DATA_ONLY: "true"
        run: |
          mkdir -p reports
          python3 scripts/run_live_paper.py --mode live --duration-minutes 300.0 | tee reports/live_runtime.log

      - name: Reconcile Live Report Fields
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 scripts/postprocess_live_reports.py --reports-dir reports

      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solana-live-reports-5h
          path: reports/

      - name: Commit and Push Results
        if: always()
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Preserve this run's report snapshot outside the Git working tree.
          report_tmp="$(mktemp -d)"
          cp -a reports/. "$report_tmp/"

          # Re-anchor onto the latest branch tip without merging generated reports.
          git fetch origin arena/01a07111-solmeme
          git reset --hard origin/arena/01a07111-solmeme
          rm -rf reports
          mkdir -p reports
          cp -a "$report_tmp/." reports/
          rm -rf "$report_tmp"

          git add reports/
          git commit -m "chore(live-audit): record 5-hour live solana mainnet validation artifacts [skip ci]" || echo "No changes to commit"
          git push origin HEAD:arena/01a07111-solmeme
