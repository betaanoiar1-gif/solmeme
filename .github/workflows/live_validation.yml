name: Solana Live Validation

on:
  push:
    branches:
      - arena/01a07111-solmeme
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solana-live-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install tabulate python-dotenv requests pandas

      - name: One-Shot Production Hardening
        run: |
          set -e
          python3 -m compileall -q app blockchain data portfolio scoring security simulation sniper scripts
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              "blockchain/rpc/rpc_client.py": ["max_retries: int = 1", "self._cache_ttl_sec = 10.0", "self._min_interval_sec = 0.10"],
              "data/ingestion/real_live_provider.py": ["def scan_recent_tokens(self, limit: int = 10)"],
              "app/orchestration/live_paper_engine.py": ["self.entry_cooldown_until", "confidence_ok", "not cooldown_active"],
              "scoring/opportunity/opportunity_scorer.py": ["mint_auth_status", "freeze_auth_status"],
              "scripts/run_live_paper.py": ["duration_minutes: float = 5.0", "os.getenv('GITHUB_SHA') or 'LOCAL'"]
          }
          for path, needles in checks.items():
              text = Path(path).read_text()
              missing = [needle for needle in needles if needle not in text]
              if missing:
                  raise SystemExit(f"HARDENING_CHECK_FAILED: {path}: {missing}")
              print(f"HARDENING_OK: {path}")
          print("FINAL_ONE_SHOT_HARDENING_COMPLETE")
          PY

      - name: Probe Network and Solana RPC
        run: |
          python3 scripts/probe_network.py

      - name: Run Solana Live Paper Trading Engine (5 Minutes)
        env:
          DATA_MODE: live
          REAL_DATA_ONLY: "true"
        run: |
          mkdir -p reports
          python3 scripts/run_live_paper.py --mode live --duration-minutes 5.0 | tee reports/live_runtime.log

      - name: Reconcile Live Report Fields
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 scripts/postprocess_live_reports.py --reports-dir reports

      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solana-live-reports-5m
          path: reports/

      - name: Commit and Push Results
        if: always()
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/ blockchain/rpc/rpc_client.py data/ingestion/real_live_provider.py app/orchestration/live_paper_engine.py scoring/opportunity/opportunity_scorer.py scripts/run_live_paper.py .github/workflows/live_validation.yml
          git commit -m "chore(live): persist final production hardening and 5-minute validation [skip ci]" || echo "No changes to commit"
          git push origin HEAD:arena/01a07111-solmeme
