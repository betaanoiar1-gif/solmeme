name: Solana Live Validation

on:
  push:
    branches:
      - arena/01a07111-solmeme
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solana-live-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install tabulate python-dotenv requests pandas

      - name: One-Shot Production Hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"PATCH_TARGET_NOT_FOUND: {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))
              print(f"PATCHED: {path}")

          # 1) Stop RPC retry storms and keep the live loop responsive.
          replace(
              "blockchain/rpc/rpc_client.py",
              "def __init__(self, endpoints: Optional[List[str]] = None, timeout: float = 2.0, max_retries: int = 3):",
              "def __init__(self, endpoints: Optional[List[str]] = None, timeout: float = 2.0, max_retries: int = 1):",
          )
          replace(
              "blockchain/rpc/rpc_client.py",
              "self._cache_ttl_sec = 5.0",
              "self._cache_ttl_sec = 8.0",
          )
          replace(
              "blockchain/rpc/rpc_client.py",
              "self._min_interval_sec = 0.1",
              "self._min_interval_sec = 0.08",
          )

          # 2) Reduce repeated transaction fan-out while keeping only real evidence.
          replace(
              "data/ingestion/real_live_provider.py",
              "def scan_recent_tokens(self, limit: int = 50) -> List[Dict[str, Any]]:",
              "def scan_recent_tokens(self, limit: int = 12) -> List[Dict[str, Any]]:",
          )
          replace(
              "data/ingestion/real_live_provider.py",
              "signatures = self.rpc.get_signatures_for_address(mint, limit=limit)\n        if not signatures:\n            return []\n\n        results = []\n        for sig_info in signatures:",
              "signatures = self.rpc.get_signatures_for_address(mint, limit=min(limit, 6))\n        if not signatures:\n            return []\n\n        results = []\n        consecutive_tx_failures = 0\n        for sig_info in signatures:",
          )
          replace(
              "data/ingestion/real_live_provider.py",
              "            tx = self.rpc.get_transaction(sig)\n            if not tx:\n                continue\n            swaps = self.swap_parser.parse_transaction(",
              "            tx = self.rpc.get_transaction(sig)\n            if not tx:\n                consecutive_tx_failures += 1\n                if consecutive_tx_failures >= 3:\n                    logger.warning(f\"Stopping tx scan for {mint[:8]}... after 3 consecutive RPC failures\")\n                    break\n                continue\n            consecutive_tx_failures = 0\n            swaps = self.swap_parser.parse_transaction(",
          )

          # 3) Do not spend RPC calls analyzing tokens that already failed mint verification.
          replace(
              "app/orchestration/live_paper_engine.py",
              "raw_tokens = self.provider.scan_recent_tokens(limit=30)",
              "raw_tokens = self.provider.scan_recent_tokens(limit=12)",
          )
          replace(
              "app/orchestration/live_paper_engine.py",
              "            if verification.is_valid_mint:\n                verified_count += 1\n                self.verified_tokens_map[mint] = verification\n\n            # 4. Ingest real trades/swaps (Preserving Provider Provenance)",
              "            if verification.is_valid_mint:\n                verified_count += 1\n                self.verified_tokens_map[mint] = verification\n            else:\n                # Invalid mints cannot contribute trustworthy swaps, security, or scoring.\n                continue\n\n            # 4. Ingest real trades/swaps (Preserving Provider Provenance)",
          )
          replace(
              "app/orchestration/live_paper_engine.py",
              "            trades = self.provider.get_recent_trades(mint, limit=30)",
              "            trades = self.provider.get_recent_trades(mint, limit=6)",
          )

          # 4) Make the scorer's PAPER_ENTRY decision the canonical paper-entry signal,
          #    while retaining the anti-chase protection as a safety gate.
          replace(
              "app/orchestration/live_paper_engine.py",
              "            should_snipe = (mode_a or mode_b or mode_c or mode_d or mode_e) and chase_verdict.is_safe_entry",
              "            entry_signal = opp_report.recommendation == \"PAPER_ENTRY\"\n            should_snipe = entry_signal and chase_verdict.is_safe_entry",
          )

          # 5) Remove stale hardcoded commit identity from live reports.
          replace(
              "scripts/run_live_paper.py",
              '    print("COMMIT: 0f8f93a")',
              '    print(f"COMMIT: {os.getenv(\'GITHUB_SHA\') or \'LOCAL\'}")',
          )

          print("ONE_SHOT_HARDENING_COMPLETE")
          PY

          python3 -m compileall -q app blockchain data portfolio scoring security simulation sniper scripts
          git diff --check

      - name: Probe Network and Solana RPC
        run: |
          python3 scripts/probe_network.py

      - name: Run Solana Live Paper Trading Engine (5 Minutes)
        env:
          DATA_MODE: live
          REAL_DATA_ONLY: "true"
        run: |
          mkdir -p reports
          python3 scripts/run_live_paper.py --mode live --duration-minutes 5.0 | tee reports/live_runtime.log

      - name: Reconcile Live Report Fields
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 scripts/postprocess_live_reports.py --reports-dir reports

      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solana-live-reports-5m
          path: reports/

      - name: Commit and Push Results
        if: always()
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/ blockchain/rpc/rpc_client.py data/ingestion/real_live_provider.py app/orchestration/live_paper_engine.py scripts/run_live_paper.py
          git commit -m "chore(live): persist one-shot production hardening and 5-minute validation [skip ci]" || echo "No changes to commit"
          git push origin HEAD:arena/01a07111-solmeme
