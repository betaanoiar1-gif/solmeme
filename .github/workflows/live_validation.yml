name: Solana Live Validation

on:
  push:
    branches:
      - arena/01a07111-solmeme
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: arena/01a07111-solmeme
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install tabulate python-dotenv requests pandas

      - name: Probe Network and Solana RPC
        run: |
          python3 scripts/probe_network.py

      - name: Run Solana Live Paper Trading Engine (30 Minutes)
        env:
          DATA_MODE: live
          REAL_DATA_ONLY: "true"
        run: |
          mkdir -p reports
          python3 scripts/run_live_paper.py --mode live --duration-minutes 30 | tee reports/live_runtime.log

      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solana-live-reports
          path: reports/

      - name: Commit and Push Results
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "chore(live-audit): record 30-minute live solana mainnet validation artifacts" || echo "No changes to commit"
          git push origin arena/01a07111-solmeme || echo "Push failed"
